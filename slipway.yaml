# slipway.yaml — the one file this application fills in for the deploy scripts.
#
# PaperMind is Slipway's first real consumer, and adopting it is what proves the
# blueprint abstracts anything at all. Two things it did not cover turned up here:
# a database, and a corpus. Both were resolved by not needing them at deploy time —
# see infra/VENDORED.md and retrieval/backends/base.py.

name: papermind
region: us-east-1

image:
  # Created once by 00_bootstrap.
  repository: papermind
  dockerfile: Dockerfile.lambda
  context: .
  # Uploaded to S3 and served from the edge, so the page does not start a container.
  static_dir: app/static

compute:
  # lambda    — scales to zero, $0 when nobody is asking. The right shape for a demo
  #             that exists to be clicked a few times.
  # apprunner — always warm. Worth it only if cold starts prove unacceptable, and that
  #             is a measurement to take rather than a guess.
  target: lambda

  # 3008 MB rather than the 1024 Slipway defaults to. The image carries a 419 MB
  # embedding model and a 92 MB corpus, and Lambda scales CPU with memory — so this is
  # mostly a cold-start dial. The number to replace this comment is not known yet:
  # it comes from the first deploy, not from an estimate.
  memory: 3008
  timeout: 60

  apprunner:
    cpu: "1 vCPU"
    memory: "2 GB"

environments:
  dev:
    cdn: false # teardown in seconds rather than the ~15 minutes CloudFront takes
    observability: true
    log_retention_days: 7
    alert_emails: []

  prod:
    cdn: true
    cdn_price_class: PriceClass_100
    observability: true
    log_retention_days: 30
    # Alarms that reach nobody are decoration. SNS emails need confirming from the inbox.
    alert_emails: []
