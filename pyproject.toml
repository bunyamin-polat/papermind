[project]
name = "papermind"
version = "0.1.0"
description = "RAG over AI research papers — ask a question, get a cited answer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Step 0-1. Everything else arrives with the step that needs it —
    # sentence-transformers at step 2, langchain at step 5, fastapi at step 7.
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

# This is an application, not a library — nothing here gets built or published,
# so uv should not look for a build backend.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
