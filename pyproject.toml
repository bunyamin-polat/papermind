[project]
name = "papermind"
version = "0.1.0"
description = "RAG over AI research papers — ask a question, get a cited answer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bunyamin Polat" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=2.53.0",
    # Step 0-1. Everything else arrives with the step that needs it —
    # sentence-transformers at step 2, langchain at step 5, fastapi at step 7.
    "pandas>=2.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic-settings>=2.7",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    # Declared explicitly even though sentence-transformers already pulls it in:
    # [tool.uv.sources] below only applies to direct dependencies, so a transitive
    # torch silently ignores the CPU index and drags CUDA into the Linux image.
    "torch>=2.0",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# This is an application, not a library — nothing here gets built or published,
# so uv should not look for a build backend.
[tool.uv]
package = false

# On Linux, PyPI's default torch wheel bundles CUDA: 2.9 GB of `nvidia` packages,
# 652 MB of triton, and a 914 MB torch — none of it reachable from a container with
# no GPU. Embedding here is CPU-only and generation happens in Ollama on the host,
# so the CPU wheel is not a compromise, it is the correct build. macOS keeps the
# default wheel, which ships MPS and no CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call a real model are slow (seconds each) and need Ollama running.
# They are excluded by default so `pytest` stays fast; run them with `-m llm`.
addopts = "-m 'not llm'"
markers = ["llm: needs a running LLM (slow)"]
# The repo root is not a package, so tell pytest to import from it.
pythonpath = ["."]
